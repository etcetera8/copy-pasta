name: Deploy landing page

on:
  push:
    branches: [master]
    # The page pulls its palette from the app's shared tokens, so a change
    # there changes the built page too.
    paths:
      - 'site/**'
      - 'src/shared/styles/**'
      # The build inputs count too: changing `base`, the site:build script,
      # or a build dependency changes the output while site/ stays untouched,
      # and the live page would silently keep serving the previous build.
      - 'vite.site.config.mts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npx --yes yarn@1.22.22 install --frozen-lockfile

      - name: Build site
        run: npx --yes yarn@1.22.22 site:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
