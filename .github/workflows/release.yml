name: Release

on:
  push:
    tags: ['v*']

# The workflow creates a release and uploads assets to it.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The app's version comes from package.json, not from the tag, so a tag
      # that disagrees produces a release named v1.1.0 holding the 1.0.0 app.
      # Nothing downstream fails, and since the assets are renamed to drop the
      # version there is no filename left to give it away either. By then the
      # tag is already public -- so check before the ten-minute build.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$tag" = "$pkg" ] || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }

      # yarn.lock is a v1 lockfile. The `yarn` on PATH is corepack's v4,
      # which refuses it outright, so pin v1 explicitly.
      - name: Install
        run: npx --yes yarn@1.22.22 install --frozen-lockfile

      - name: Lint
        run: npx --yes yarn@1.22.22 lint

      - name: Typecheck
        run: npx --yes yarn@1.22.22 typecheck

      - name: Test
        run: npx --yes yarn@1.22.22 test

      # Both architectures land in out/make, which is not cleared between
      # runs, and the DMG names already carry the arch.
      - name: Build arm64
        run: npx --no-install electron-forge make --arch=arm64

      - name: Build x64
        run: npx --no-install electron-forge make --arch=x64

      # A .node that never shipped produces no build error -- just an app
      # that opens nothing. Fail here instead of shipping that.
      - name: Check both packages are startable
        run: |
          node tools/check-packaged-app.js arm64
          node tools/check-packaged-app.js x64

      # A missing icon is invisible in the build log: packager treats an
      # unresolvable path as a warning rather than an error, Forge suppresses
      # even that with quiet: true, and the bundle's Info.plist names
      # `electron.icns` either way. Only the bytes tell them apart.
      - name: Check the app icon shipped
        run: |
          node tools/check-app-icon.js
          node tools/check-app-icon.js arm64
          node tools/check-app-icon.js x64

      # Not optional despite shipping unsigned: an arm64 binary with no
      # valid signature does not launch. This also seals the bundle
      # resources, which the linker's own signature does not cover.
      - name: Ad-hoc sign
        run: |
          for arch in arm64 x64; do
            codesign --force --deep --sign - "out/Copy Pasta-darwin-$arch/Copy Pasta.app"
            codesign --verify --deep --strict --verbose=2 "out/Copy Pasta-darwin-$arch/Copy Pasta.app"
          done

      # The DMGs were made before signing, so remake them around the signed
      # bundles. Forge reuses the existing package rather than rebuilding it.
      - name: Repackage signed DMGs
        run: |
          rm -f out/make/*.dmg
          npx --no-install electron-forge make --arch=arm64 --skip-package
          npx --no-install electron-forge make --arch=x64 --skip-package

      # The landing page links straight at
      # /releases/latest/download/Copy-Pasta-<arch>.dmg, a redirect that only
      # resolves while the asset name is identical in every release -- so the
      # version has to come out of the filename. Forge cannot do this itself:
      # MakerDMG's `name` is also the mounted volume's name, and it is one
      # static string shared by both arch builds, which land in the same
      # uncleared out/make and would overwrite each other.
      #
      # After the repackage step, which deletes and remakes the DMGs.
      # site.test.ts pins these names against the page's hrefs.
      - name: Name the DMGs for the permanent download links
        run: |
          for arch in arm64 x64; do
            files=(out/make/*-"$arch".dmg)
            [ ${#files[@]} -eq 1 ] || { echo "expected one $arch dmg, got: ${files[*]}"; exit 1; }
            mv "${files[0]}" "out/make/Copy-Pasta-$arch.dmg"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/make/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
